<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Order Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Order Up: inglés americano cotidiano para el trabajo (Pre-A1 a A1). Escucha, frases completas, práctica y conversación hablada.">
<meta name="theme-color" content="#0d6b57">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Multi-unit app. Layout concept: one-column lesson sheet, one task per screen, a stepper on top and a coffee-shop receipt as the reward. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --surface-2:#e8eeeb; --ink:#13201c; --muted:#53655f; --line:#d3dcd8;
  --accent:#0d6b57; --accent-ink:#ffffff; --accent-soft:#d6eee6;
  --hl:#ffe08a; --hl-ink:#3a2a00;
  --good:#1b7a3e; --good-soft:#dcf2e3; --bad:#b3261e; --bad-soft:#fbe1de;
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'DM Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1614; --surface:#17211e; --surface-2:#1f2c28; --ink:#e7efec; --muted:#9bada6; --line:#2c3b36;
    --accent:#5ccfb2; --accent-ink:#04231c; --accent-soft:#17352e;
    --hl:#6b5514; --hl-ink:#ffe9a8;
    --good:#7ad99a; --good-soft:#173525; --bad:#ff9b92; --bad-soft:#3e1b18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1614; --surface:#17211e; --surface-2:#1f2c28; --ink:#e7efec; --muted:#9bada6; --line:#2c3b36;
  --accent:#5ccfb2; --accent-ink:#04231c; --accent-soft:#17352e;
  --hl:#6b5514; --hl-ink:#ffe9a8;
  --good:#7ad99a; --good-soft:#173525; --bad:#ff9b92; --bad-soft:#3e1b18;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5;
  padding-block:20px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.app{max-width:720px; margin:0 auto; display:grid; gap:16px}
.mono{font-family:var(--font-mono); font-size:.82rem; letter-spacing:.02em}
.muted{color:var(--muted)} .small{font-size:.88rem}
h1,h2,h3{font-family:var(--font-display); line-height:1.15; margin:0 0 8px; text-wrap:balance; letter-spacing:-.015em}
h1{font-size:clamp(1.6rem,5.5vw,2.2rem); font-weight:700}
h2{font-size:1.25rem; font-weight:700}
h3{font-size:1.05rem; font-weight:700}
p{margin:0 0 12px}
.lead{color:var(--muted); max-width:62ch}
mark{background:var(--hl); color:var(--hl-ink); padding:0 .22em; border-radius:3px}

.top{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between}
.brand{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700; font-size:1.2rem; color:var(--accent)}
.seg{display:flex; background:var(--surface-2); border-radius:12px; padding:4px; gap:4px}
.seg button{border:0; background:transparent; color:var(--muted); font:inherit; font-weight:600; min-height:40px; padding:0 16px; border-radius:9px; cursor:pointer}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12)}
.badge{display:inline-block; min-width:20px; padding:0 6px; border-radius:10px; background:var(--accent); color:var(--accent-ink); font-size:.75rem; line-height:20px; text-align:center; margin-left:4px}

.topr{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
#voicepanel:empty{display:none}
.stepper{display:grid; gap:10px}
.steptxt{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.bars{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.bar{height:8px; padding:0; border:0; border-radius:4px; background:var(--line); position:relative; cursor:pointer}
.bar::after{content:""; position:absolute; inset:-12px 0}
.bar.done{background:var(--accent); opacity:.55} .bar.cur{background:var(--accent)}
.bar:disabled{cursor:default}

.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; min-width:0}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 18px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-weight:600; cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.icon{width:44px; padding:0; flex:none; border-radius:50%; color:var(--accent); background:var(--accent-soft); border-color:transparent}
.btn.big{min-height:52px; padding:0 22px}
.btn[disabled]{opacity:.5; cursor:default}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px}
.actions.between{justify-content:space-between; margin-top:0}

.chips{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0}
.chip{min-height:38px; padding:0 14px; border-radius:19px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:.92rem; font-weight:500; cursor:pointer}
.chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
.chip.on::before{content:"\2713"; margin-right:6px; color:var(--accent)}
.note{background:var(--surface-2); border-radius:10px; padding:12px 14px; font-size:.92rem}

.dialog{display:grid; gap:12px; margin-top:12px}
.line{display:grid; grid-template-columns:44px minmax(0,1fr); gap:12px; align-items:start; border-radius:12px}
.line.now .bubble{outline:2px solid var(--accent)}
.bubble{background:var(--surface-2); border-radius:12px; padding:10px 14px; min-width:0}
.line.you .bubble{background:var(--accent-soft)}
.who{font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:2px}
.en{font-size:1.08rem; font-weight:500}
.es{color:var(--muted); font-size:.92rem; margin-top:2px}
.masked{filter:blur(7px); cursor:pointer; user-select:none}

.chunk{border-top:1px solid var(--line); padding:16px 0; display:grid; gap:8px}
.chunk:first-of-type{border-top:0}
.chunk-top{display:grid; grid-template-columns:44px minmax(0,1fr); gap:12px; align-items:center}
.pat{font-family:var(--font-display); font-weight:700; font-size:1.25rem; line-height:1.2}
.gap{background:var(--hl); color:var(--hl-ink); border-radius:4px; padding:0 .35em}
.hint{font-size:.9rem; color:var(--muted); padding-left:56px}
.slots{display:flex; flex-wrap:wrap; gap:8px; padding-left:56px}
ul.clean{list-style:none; margin:0; padding:0; display:grid; gap:10px}
ul.clean li{padding-left:22px; position:relative}
ul.clean li::before{content:""; position:absolute; left:2px; top:.62em; width:8px; height:8px; border-radius:50%; background:var(--accent)}

.exprog{display:flex; align-items:center; gap:12px; margin-bottom:14px}
.meter{flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden}
.meter i{display:block; height:100%; background:var(--accent)}
.eyebrow{font-family:var(--font-mono); font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
.audio{display:flex; flex-wrap:wrap; gap:10px; margin:12px 0}
.opts{display:grid; gap:10px; margin-top:12px}
.opt{display:block; width:100%; text-align:left; min-height:52px; padding:12px 16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:1.05rem; cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.good{background:var(--good-soft); border-color:var(--good)}
.opt.bad{background:var(--bad-soft); border-color:var(--bad)}
.opt[disabled]{cursor:default; color:var(--ink)}
.sentence{font-family:var(--font-display); font-size:1.4rem; font-weight:600; margin:10px 0}
.answer{min-height:60px; border:2px dashed var(--line); border-radius:12px; padding:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0}
.bank{display:flex; flex-wrap:wrap; gap:8px}
.tok{min-height:44px; padding:0 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:1.05rem; font-weight:500; cursor:pointer}
.fb{border-radius:12px; padding:12px 14px; margin-top:14px}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)}
.fb .mono{display:block; margin-top:6px}

.ticket{font-family:var(--font-mono); font-size:.9rem; background:var(--surface); border:1px dashed var(--muted); border-radius:6px; padding:18px; max-width:340px; margin:16px auto 0}
.tk-h{text-align:center; font-weight:500; letter-spacing:.12em; margin-bottom:2px}
.tk-s{text-align:center; color:var(--muted); font-size:.78rem; margin-bottom:12px}
.trow{display:flex; gap:8px; align-items:baseline; margin:4px 0}
.dots{flex:1; border-bottom:2px dotted var(--line); transform:translateY(-4px)}
.tk-t{border-top:1px dashed var(--muted); margin-top:10px; padding-top:8px; font-weight:500}
.tk-f{text-align:center; margin-top:12px; color:var(--muted)}

.goal{display:grid; grid-template-columns:28px minmax(0,1fr); gap:12px; padding:12px 0; border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0}
.tick{width:24px; height:24px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font-size:.8rem}
.goal.ok .tick{background:var(--good); border-color:var(--good); color:var(--surface)}
.field{display:grid; gap:4px}
.field label{font-size:.85rem; color:var(--muted)}
.field select,.field input{min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; padding:0 12px; width:100%}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:14px 0}
.check{display:flex; gap:12px; align-items:center; min-height:44px}
.check input{width:22px; height:22px; accent-color:var(--accent)}
.rate{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-top:16px}
.bigtext{font-family:var(--font-display); font-size:1.6rem; font-weight:700; margin:12px 0}
.btn.sm{min-height:38px; padding:0 14px; font-size:.92rem}
.btn svg{flex:none}
.tools{display:flex; flex-wrap:wrap; gap:8px; padding-left:56px}
.slotlabel{padding-left:56px; font-size:.85rem; color:var(--muted)}
.filled{padding-left:56px; font-weight:500}
.speak{margin-left:56px; background:var(--surface-2); border-radius:12px; padding:14px; display:grid; gap:10px; min-width:0}
.micbox{display:grid; gap:12px}
.microw{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.mic.live{background:var(--bad); border-color:var(--bad); color:var(--surface)}
.heard{min-height:48px; padding:10px 14px; border-radius:10px; background:var(--surface); border:1px solid var(--line); font-size:1.05rem}
.sentence.sm{font-size:1.15rem; margin:0}
.w{display:inline-block; padding:0 .3em; border-radius:4px; margin:2px 2px}
.w.ok{background:var(--good-soft)}
.w.miss{background:var(--bad-soft); text-decoration:underline}
.w.extra{background:var(--surface-2); color:var(--muted); text-decoration:line-through}
.cmp{display:grid; gap:8px; margin-top:12px}
.cmp .row{display:grid; grid-template-columns:64px minmax(0,1fr); gap:10px; align-items:baseline}
.fb.warn{background:var(--hl); color:var(--hl-ink)}
.goalline{display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; margin-top:16px}
.edge{border-color:var(--accent); background:var(--accent-soft)}
@media (max-width:520px){ .tools,.slotlabel,.filled,.slots{padding-left:0} .speak{margin-left:0} }
@media (prefers-reduced-motion:no-preference){ .opt,.btn,.chip{transition:border-color .15s, background .15s} }
.units{display:grid;gap:12px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.unit-top{display:flex;gap:12px;align-items:flex-start}
.unit h3{margin:0}
.unum{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.unit .meter{display:block;flex:none}
.reslist{display:grid;gap:10px;margin-top:12px}
a.res{display:grid;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);text-decoration:none;min-width:0}
a.res:hover{border-color:var(--accent)}
a.res:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rt{font-weight:700;color:var(--accent);overflow-wrap:anywhere}
.tag{justify-self:start;font-family:var(--font-mono);font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.rd{font-size:14px;color:var(--muted)}
@media (max-width:560px){.seg button{padding:0 10px;font-size:14px}}
h2.grp{margin:10px 0 0;font-family:var(--font-display)}
</style>
</head>
<body>

<div class="app" id="app"></div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var KEY='order-up-cafe-v1';

/* ---------- Content ---------- */
var LINES=[
 {id:'l1',r:'B',en:'Hi! What can I get for you?',html:'Hi! <mark>What can I get</mark> for you?',es:'¡Hola! ¿Qué le sirvo?'},

 {id:'l10',r:'C',en:'You too! Thanks!',html:'<mark>You too!</mark> Thanks!',es:'¡Igualmente! ¡Gracias!'}
];

function V(list,fn){return list.map(function(x){return {l:x,t:fn(x)};});}
var CHUNKS=[
 {id:'c1',en:'Can I get a ___, please?',es:'¿Me da un/una ___, por favor?',sr:'C',
  say:[['Can I get a medium latte, please?','C']],
  slots:V(['small coffee','medium latte','large iced tea','small hot chocolate','medium cappuccino','large iced coffee','bottle of water','blueberry muffin'],function(x){return 'Can I get a '+x+', please?';})},
 {id:'c9',en:"I'd like a ___, please.",es:'Quisiera un/una ___, por favor.',sr:'C',
  say:[["I'd like a large coffee, please.",'C']],
  slots:V(['large coffee','small latte','medium mocha','plain bagel','chocolate croissant','large lemonade'],function(x){return "I'd like a "+x+', please.';})},
 {id:'c11',en:'Can I get that with ___?',es:'¿Me lo puede preparar con ___?',sr:'C',
  say:[['Can I get that with oat milk?','C']],
  slots:V(['oat milk','almond milk','extra ice','whipped cream','an extra shot','no sugar'],function(x){return 'Can I get that with '+x+'?';})},
 {id:'c10',en:'Do you have ___?',es:'¿Tienen ___?',sr:'C',
  say:[['Do you have decaf coffee?','C']],

  slots:V(['To go, please.','For here, please.','To go, thanks.','For here, thanks.'],function(x){return x;})},
 {id:'c3',en:'How much is it?',es:'¿Cuánto cuesta?',sr:'C',
  say:[['How much is it?','C']],
  slots:[{l:'the latte',t:'How much is the latte?'},{l:'a muffin',t:'How much is a muffin?'},{l:'a large coffee',t:'How much is a large coffee?'},{l:"What's the total?",t:"What's the total?"}]},
 {id:'c4',en:"That'll be ___.",es:'Son ___. (el precio)',sr:'B',alt:["That'll be $5.42."],
  say:[["That'll be five forty-two.",'B']],
  slots:[['$3.75','three seventy-five'],['$4.25','four twenty-five'],['$5.42','five forty-two'],['$6.80','six eighty'],['$10.50','ten fifty'],['$12.35','twelve thirty-five']].map(function(p){return {l:p[0],t:"That'll be "+p[1]+'.',alt:["That'll be "+p[0]+'.']};})},

 {id:'c5',en:"Anything else? — No, that's it.",es:'¿Algo más? — No, eso es todo.',sr:'C',

 {id:'c6',en:"What's the name? — It's ___.",es:'¿A nombre de quién? — A nombre de ___.',sr:'C',
  say:[["What's the name?",'B'],["It's Ana.",'C']],
  slots:V(['Ana','Luis','Marta','Carlos','Sofía','Diego'],function(x){return "It's "+x+'.';}).concat([{l:'My name is Ana',t:'My name is Ana.'}])},

var EX=[
 {id:'e1',t:'listen',q:'Escucha. ¿Qué te preguntan?',a:[['For here or to go?','B']],

 {id:'e2',t:'listen',q:'Escucha al barista. ¿Cuál es la mejor respuesta?',a:[['Anything else?','B']],

 {id:'e4',t:'build',q:'Arma la frase: pide un latte mediano.',

 {id:'e5',t:'build',q:'Arma la pregunta: ¿cuánto cuesta?',

 {id:'e6',t:'fill',q:'Completa para pedir con cortesía.',pre:'___ I get a small coffee, please?',

 {id:'e7',t:'fill',q:'Completa la respuesta.',pre:"Anything else? — No, that's ___.",

 {id:'e8',t:'reply',q:'El barista te saluda. ¿Qué respondes?',a:[["Hi! How's it going?",'B']],

  why:'"How\'s it going?" es un saludo, no una pregunta médica. Responde corto y devuelve la pregunta: "Good, thanks. You?"'}

/* ---------- Speech comparison ---------- */
function norm(s){
  s=String(s||'').toLowerCase().replace(/[‘’`]/g,"'");
  s=s.replace(/\$/g,' ').replace(/(\d)[.,:](\d)/g,'$1 $2').replace(/'/g,'').replace(/[^a-z0-9à-ÿ\s]/g,' ');
  return s.replace(/\s+/g,' ').trim();
}
function words(s){var n=norm(s);return n?n.split(' '):[];}
function lcs(a,b){
  var m=a.length,n=b.length,dp=[],i,j;
  for(i=0;i<=m;i++){dp[i]=[];for(j=0;j<=n;j++)dp[i][j]=0;}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++) dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  var mm=a.map(function(){return false;}),hm=b.map(function(){return false;});
  i=m;j=n;
  while(i>0&&j>0){
    if(a[i-1]===b[j-1]){mm[i-1]=true;hm[j-1]=true;i--;j--;}
    else if(dp[i-1][j]>=dp[i][j-1]) i--; else j--;
  }
  return {n:dp[m][n],mm:mm,hm:hm};
}
function tokenMarks(text,matched,mode,badCls){
  var toks=String(text).split(/\s+/).filter(Boolean), pos=0, out=[];
  toks.forEach(function(tk){
    var n=words(tk).length;
    if(!n){out.push(esc(tk));return;}
    if(mode==='plain'){pos+=n;out.push('<span class="w">'+esc(tk)+'</span>');return;}
    var ok=!!mode; if(!mode){ok=true;for(var k=0;k<n;k++) if(!matched[pos+k]) ok=false;}
    pos+=n; out.push('<span class="w '+(ok?'ok':badCls)+'">'+esc(tk)+'</span>');
  });
  return out.join(' ');
}
function cmpHTML(model,heard,mode){
  var r=lcs(words(model),words(heard));
  return '<div class="cmp"><div class="row"><span class="mono">Tú</span><div>'+tokenMarks(heard,r.hm,mode,'extra')+'</div></div>'+
   '<div class="row"><span class="mono">Modelo</span><div>'+tokenMarks(model,r.mm,mode,'miss')+'</div></div></div>';
}
function evalShadow(heard,cur){
  var h=words(heard);
  if(!h.length) return {lvl:'none'};
  var best=null;
  [cur.t].concat(cur.alt||[]).forEach(function(t){
    var mw=words(t), r=lcs(mw,h), score=r.n/Math.max(mw.length,h.length);
    if(!best||score>best.score) best={score:score,t:t};
  });
  var lvl=best.score>=0.9?'best':(best.score>=0.55?'almost':'off');
  return {lvl:lvl,score:best.score,heard:heard,model:cur.t,cmp:cmpHTML(cur.t,heard,lvl==='best'?true:false)};
}

  var cbP=function(){},cbF=function(){},cbS=function(){},rec=null;

    start:function(o){

/* ---------- Step 2: Chunks ---------- */
function curText(c){
  var i=S.sp.sel[c.id];
  if(i!==undefined&&c.slots&&c.slots[i]) return {t:c.slots[i].t,alt:c.slots[i].alt||[],role:c.sr};
  var last=c.say[c.say.length-1];
  return {t:last[0],alt:c.alt||[],role:last[1]};
}
function shadowResult(r){
  if(r.lvl==='none') return '<div class="fb bad" role="status"><strong>No escuché nada.</strong> Revisa que el micrófono esté activo e inténtalo otra vez.</div>';
  var cls=r.lvl==='best'?'good':(r.lvl==='almost'?'warn':'bad');
  var lab=r.lvl==='best'?'Muy bien.':(r.lvl==='almost'?'Casi.':'Todavía no.');
  var msg=r.lvl==='best'?'Se entendió la frase completa.':(r.lvl==='almost'?'Fíjate en las palabras marcadas y repite.':'Escucha el modelo otra vez, más lento, y repite.');
  return '<div class="fb '+cls+'" role="status"><strong>'+lab+'</strong> '+msg+'</div>'+r.cmp;
}
function speakPanel(c,cur){
  var key='chunk:'+c.id, r=S.talk.key===key?S.talk.res:null;
  return '<div class="speak"><div class="eyebrow">Dilo tú</div><div class="sentence sm">“'+esc(cur.t)+'”</div>'+
   '<div class="actions" style="margin-top:0"><button class="btn sm" data-act="say" data-t="'+esc(cur.t)+'" data-r="'+cur.role+'">'+PLAY+' Escuchar modelo</button>'+
   '<button class="btn sm" data-act="say" data-t="'+esc(cur.t)+'" data-r="'+cur.role+'" data-slow="1">Más lenta</button></div>'+
   '<div class="micbox">'+micArea(key)+'</div>'+(r?shadowResult(r):'')+'</div>';
}
function chunkHTML(c){
  var sel=S.sp.sel[c.id], cur=curText(c), hasGap=c.en.indexOf('___')>=0, open=S.sp.open===c.id;
  var h='<article class="chunk"><div class="chunk-top"><button class="btn icon" data-act="sayseq" data-id="'+c.id+'" aria-label="Escuchar la frase">'+PLAY+'</button>'+
   '<div><div class="pat">'+esc(c.en).replace('___','<span class="gap">___</span>')+'</div><div class="es">'+esc(c.es)+'</div></div></div>';
  if(c.slots){
    h+='<div class="slotlabel">'+(hasGap?'Completa el hueco con:':'Otras formas de decirlo:')+'</div><div class="slots" role="group">'+
     c.slots.map(function(s,i){return '<button class="chip'+(sel===i?' on':'')+'" aria-pressed="'+(sel===i?'true':'false')+'" data-act="slot" data-id="'+c.id+'" data-i="'+i+'">'+esc(s.l)+'</button>';}).join('')+'</div>';
  }

/* ---------- Step 3: Practice ---------- */
function exStart(){
  S.ex={queue:EX.map(function(e){return e.id;}),idx:0,first:{},retried:{},done:false,order:null,worder:null,built:[],picked:null,result:null};
  exPrep();
}
function exItem(){return EX.filter(function(e){return e.id===S.ex.queue[S.ex.idx];})[0];}
function exPrep(){
  var it=exItem(); if(!it) return;
  S.ex.picked=null; S.ex.result=null; S.ex.built=[];
  if(it.opts) S.ex.order=shuffle(it.opts.map(function(_,i){return i;}));
  if(it.t==='build'){
    var w, same;
    do{ w=shuffle(it.words.map(function(_,i){return i;})); same=w.length===it.ans.length&&w.every(function(v,i){return it.words[v]===it.ans[i];}); }while(same);
    S.ex.worder=w;
  }
}
function exRecord(it,ok){
  var ex=S.ex;
  if(!ex.retried[it.id]){ ex.first[it.id]=ok; if(!ok){ ex.retried[it.id]=true; ex.queue.push(it.id); } }
  if(ok&&it.num&&ex.first[it.id]){ recProg('num',1); }
  ex.result=ok;
}
function bodyPractice(){
  var ex=S.ex;
  if(ex.done){
    var score=EX.filter(function(e){return ex.first[e.id];}).length;
    var missed=EX.filter(function(e){return !ex.first[e.id];});
    return '<section class="card"><div class="eyebrow">Resultado</div><h1>'+score+' de '+EX.length+' a la primera</h1>'+
     (missed.length?'<p class="lead">Estas son las que conviene reforzar. Ya las repetiste una vez.</p><ul class="clean">'+missed.map(function(e){return '<li>'+esc(e.why)+'</li>';}).join('')+'</ul>':'<p class="lead">Sin errores. Ya reconoces estas frases al oírlas y al armarlas.</p>')+
     '<div class="actions"><button class="btn" data-act="exRestart">Repetir práctica</button></div></section>'+nav(true,'Conversación');
  }
  var it=exItem(), total=ex.queue.length, retry=ex.idx>=EX.length, inner='';
  if(it.a){
    inner+='<div class="audio"><button class="btn primary big" data-act="say" data-t="'+esc(it.a[0][0])+'" data-r="'+it.a[0][1]+'">'+PLAY+' Escuchar</button>'+
     '<button class="btn big" data-act="say" data-t="'+esc(it.a[0][0])+'" data-r="'+it.a[0][1]+'" data-slow="1">Más lento</button></div>';
  }
  if(it.t==='fill'){
    var filled=ex.picked!==null?it.opts[it.ans]:'___';
    inner+='<div class="sentence">'+esc(it.pre).replace('___','<span class="gap">'+esc(filled)+'</span>')+'</div>';
  }
  if(it.opts){
    inner+='<div class="opts">'+ex.order.map(function(oi){
      var cls=''; if(ex.picked!==null){ if(oi===it.ans) cls='good'; else if(oi===ex.picked) cls='bad'; }
      return '<button class="opt '+cls+'" data-act="exPick" data-i="'+oi+'"'+(ex.picked!==null?' disabled':'')+'>'+esc(it.opts[oi])+'</button>';
    }).join('')+'</div>';
  }
  if(it.t==='build'){
    var locked=ex.result!==null;
    inner+='<div class="answer" aria-label="Tu frase">'+(ex.built.length?ex.built.map(function(wi){return '<button class="tok" data-act="exUndo" data-w="'+wi+'"'+(locked?' disabled':'')+'>'+esc(it.words[wi])+'</button>';}).join(''):'<span class="muted">Toca las palabras en orden</span>')+'</div>'+
     '<div class="bank">'+ex.worder.filter(function(wi){return ex.built.indexOf(wi)<0;}).map(function(wi){return '<button class="tok" data-act="exTok" data-w="'+wi+'"'+(locked?' disabled':'')+'>'+esc(it.words[wi])+'</button>';}).join('')+'</div>'+
     (locked?'':'<div class="actions"><button class="btn primary" data-act="exCheck"'+(ex.built.length?'':' disabled')+'>Comprobar</button></div>');
  }
  var fb='';
  if(ex.result!==null){
    var last=ex.idx>=ex.queue.length-1;
    fb='<div class="fb '+(ex.result?'good':'bad')+'" role="status"><strong>'+(ex.result?'Bien.':'Todavía no.')+'</strong> '+esc(it.why)+
      (!ex.result&&it.t==='build'?'<span class="mono">Correcto: '+esc(it.ans.join(' '))+'</span>':'')+'</div>'+
      '<div class="actions"><button class="btn primary" data-act="exNext">'+(last?'Ver resultado':'Continuar')+'</button></div>';
  }
  return '<section class="card"><div class="exprog"><span class="mono">'+(ex.idx+1)+' / '+total+'</span><div class="meter"><i style="width:'+Math.round(ex.idx/total*100)+'%"></i></div></div>'+
   (retry?'<div class="eyebrow">Otra vez, para fijarlo</div>':'')+'<h2>'+esc(it.q)+'</h2>'+inner+fb+'</section>'+
   '<div class="actions between"><button class="btn" data-act="back">← Atrás</button><span></span></div>';
}

/* ---------- Units (data) ---------- */
var UNITS=[];
function LN(id,r,en,es){return {id:id,r:r,en:en.replace(/\[\[|\]\]/g,''),html:esc(en).replace(/\[\[/g,'<mark>').replace(/\]\]/g,'</mark>'),es:es};}
function SL(list,pre,post){return V(list,function(x){return pre+x+post;});}
function TN(goal,hint,say,rules,offMsg,model){
  return {goal:goal,hint:hint,say:typeof say==='function'?say:function(){return say;},check:RC(rules,offMsg,model),
    fallback:function(){var s=null;return {model:model,set:s};}};
}
function RC(rules,offMsg,offModel){
  return function(t,m){
    var n=norm(t);
    for(var i=0;i<rules.length;i++){
      var r=rules[i], mt=n.match(r[0]); if(!mt) continue;
      var model=typeof r[3]==='function'?r[3](mt,m):r[3], set=null;
      if(r[4]){ set={}; for(var k in r[4]) set[k]=String(r[4][k]).replace(/\$(\d)/g,function(_,d){return cap(mt[+d]||'');}); }
      return {lvl:r[1],msg:r[2],model:model,set:set};
    }
    return {lvl:'off',msg:offMsg,model:offModel};
  };
}

/* ---------- Compact builders for the extra units ---------- */
function K(en,es,sr,words,pre,post){pre=pre||'';post=post||'';return {en:en,es:es,sr:sr,say:[[pre+words[0]+post,sr]],slots:SL(words,pre,post)};}
function LI(q,a,ar,opts,why,num){return {t:'listen',q:q,a:[[a,ar]],opts:opts,ans:0,why:why,num:!!num};}
function FI(q,pre,opts,sayT,why){return {t:'fill',q:q,pre:pre,opts:opts,ans:0,say:[sayT,'C'],why:why};}
function BU(q,toks,dis,why){return {t:'build',q:q,words:toks.concat(dis),ans:toks,say:[toks.join(' '),'C'],why:why};}
function RP(q,a,opts,why){return {t:'reply',q:q,a:[[a,'B']],opts:opts,ans:0,why:why};}
function SM(b,best,ok,off){return {b:b,opts:[{t:best[0],k:'best',f:best[1]||'Muy natural y claro.'},{t:ok[0],k:'ok',f:ok[1]||'Se entiende, pero se puede decir mejor.'},{t:off[0],k:'off',f:off[1]||'No encaja con lo que te preguntan.'}]};}
function T2(goal,hint,say,best,ok,model,offMsg){
  var rules=[[best,'best','Muy bien.',model]];
  if(ok) rules.push([ok,'ok','Se entiende. Más natural: "'+model+'"',model]);
  return TN(goal,hint,say,rules,offMsg||'No entendí. Prueba con: "'+model+'"',model);
}
var ELLLO=function(t){return R('ELLLO: conversaciones fáciles','https://elllo.org/levels','Listening','Elige el nivel más fácil y busca conversaciones sobre '+t+'. Escucha dos veces antes de leer la transcripción.');};
var YG=function(p){return R('YouGlish: la frase en la vida real','https://youglish.com/','Listening','Busca '+p+', elige el acento US y oye cómo lo dicen personas reales en videos.');};
var ESLW=function(d){return R('ESL Lab: Everyday English for Work','https://www.esl-lab.com/study-guide/everyday-english-for-work/','Listening',d||'Audios de situaciones de trabajo con preguntas. Escucha primero sin leer.');};
var S7L=function(d){return R('7ESL: Business English (listening)','https://7esl.com/listening/business-english/','Listening',d||'Escenas de trabajo con transcripción.');};
var S7S=function(d){return R('7ESL: Business English (speaking)','https://7esl.com/speaking/business-english/','Speaking',d||'Practica hablando con escenas de trabajo.');};
var VOAL=function(slug,t,d){return R('VOA Let\'s Learn English: '+t,'https://learningenglish.voanews.com/a/'+slug+'.html','Listening y speaking',d||'Lección en video con transcripción y voces de EE. UU. Pausa y repite en voz alta.');};
var S7U=function(unit,t,kind,d){return R('7ESL: '+t+' ('+(kind==='speaking'?'speaking':'listening')+')','https://7esl.com/'+kind+'/?unit='+unit,kind==='speaking'?'Speaking':'Listening',d);};
function MU(o){

  var g=[{t:o.g1||'Entender y usar las frases de la unidad',d:'ejercicios de práctica',k:'ex'},{t:'Elegir respuestas naturales',d:'conversación con opciones',k:'nat'},{t:'Mantener una conversación hablando',d:o.turns.length+' turnos respondidos en voz alta',k:'mine'}];
  if(o.num) g.splice(1,0,{t:'Entender números dichos en voz alta',d:o.numd||'ejercicio de escucha',k:'num'});
  UNITS.push({id:id,ord:o.ord,tema:o.tema,grp:o.grp||'b',title:o.title,es:o.es,blurb:o.blurb||o.es+'.',other:o.other||'Compañero',scene:o.scene,can:o.can,mins:15,
    lines:o.lines.map(function(l,i){return LN(id+'l'+(i+1),l[0],l[1],l[2]);}),
    chunks:o.chunks.map(function(c,i){c.id=id+'c'+(i+1);return c;}),
    ex:o.ex.map(function(e,i){e.id=id+'e'+(i+1);return e;}),
    sim:o.sim,turns:o.turns,notes:o.notes,mineIntro:o.mineIntro||['Si quieres, usa tus propios datos.'],res:o.res,goals:g});
}

  SM('Take a shovel and the hose.',['Okay. Where is the hose?','Muy bien.'],['Hose?','Mejor la pregunta completa.'],['Card, please.']),

  var n=m.n, t=TURNS[n], line=t.say(m.m), key='M'+n, hidden=!S.set.showEn&&!S.revealed[key];
  var needMic=!m.res||m.res.lvl==='off'||m.res.lvl==='none';
  return '<section class="card"><div class="exprog"><span class="mono">'+(n+1)+' / '+TURNS.length+'</span><div class="meter"><i style="width:'+Math.round(n/TURNS.length*100)+'%"></i></div></div>'+
   controls(['showEn','slow'])+
   '<div class="dialog">'+mineLog(m)+
   '<div class="line them"><button class="btn icon" data-act="say" data-t="'+esc(line)+'" data-r="B" aria-label="Escuchar la frase">'+PLAY+'</button><div class="bubble"><div class="who">'+U.other+'</div><div class="en'+(hidden?' masked" data-act="reveal" data-k="'+key+'" role="button" tabindex="0" aria-label="Mostrar el texto':'')+'">'+esc(line)+'</div></div></div></div>'+
   '<div class="goalline"><div><div class="eyebrow">Tu objetivo</div><strong>'+t.goal+'</strong></div><button class="btn sm" data-act="mineHint">'+(m.hint?'Ocultar pista':'Ver pista')+'</button></div>'+
   (m.hint?'<div class="note" style="margin-top:10px">Puedes decir algo como: <strong>'+esc(t.hint)+'</strong></div>':'')+
   mineResult(m)+(needMic?'<div class="micbox" style="margin-top:14px">'+micArea('mine')+'</div>':'')+'</section>'+
   '<div class="actions between"><button class="btn" data-act="back">← Atrás</button><span></span></div>';
}

/* ---------- Review (spaced repetition) ---------- */
function dueCards(){
  var now=Date.now();
  return ALLC.filter(function(c){return S.deck[c.id]&&S.deck[c.id].due<=now;});
}
function revStart(){
  S.review={queue:shuffle(dueCards().map(function(c){return c.id;})),show:false,again:{},done:0};
}
function when(ts){
  var h=(ts-Date.now())/36e5; if(h<=0) return 'ahora'; if(h<1) return 'en unos minutos';
  var d=Math.round(h/24); return d<=1?'mañana':'en '+d+' días';
}
function bodyReview(){
  var ids=Object.keys(S.deck);
  if(!ids.length){
    return '<section class="card"><h1>Repaso</h1><p class="lead">Aquí vuelven las frases que guardes al terminar cada unidad, justo cuando estás por olvidarlas.</p>'+
     '<div class="actions"><button class="btn primary" data-act="view" data-v="home">Ir a las unidades</button></div></section>';
  }
  var r=S.review||(revStart(),S.review);
  if(!r.queue.length){
    var next=ids.map(function(i){return S.deck[i].due;}).sort(function(a,b){return a-b;})[0];
    return '<section class="card"><div class="eyebrow">Repaso</div><h1>Todo al día</h1><p class="lead">Repasaste '+r.done+' '+(r.done===1?'frase':'frases')+' hoy. Próximo repaso: '+when(next)+'.</p></section>';
  }
  var c=chunkById(r.queue[0]);
  var back=r.show?
   '<div class="sentence">'+esc(c.en).replace('___','<span class="gap">___</span>')+'</div>'+
   '<div class="actions" style="margin-top:0"><button class="btn" data-act="revsay">'+PLAY+' Escuchar</button></div>'+
   '<div class="rate"><button class="btn" data-act="revRate" data-v="no">No la sabía</button><button class="btn" data-act="revRate" data-v="almost">Casi</button><button class="btn primary" data-act="revRate" data-v="yes">La sé</button></div>':
   '<div class="actions"><button class="btn primary big" data-act="revShow">Mostrar respuesta</button></div>';
  return '<section class="card"><div class="exprog"><span class="mono">Quedan '+r.queue.length+'</span></div>'+
   '<div class="eyebrow">Dilo en inglés</div><div class="bigtext">'+esc(c.es).replace('___','<span class="gap">___</span>')+'</div>'+back+'</section>';
}

/* ---------- Voice panel ---------- */
function voicePanel(){
  if(!S.voicesOpen) return '';
  function opts(role){
    var cur=S.voices[role];
    return '<option value="">Automática (según el sexo elegido)</option>'+tts.voices.map(function(v){
      return '<option value="'+esc(v.name)+'"'+(v.name===cur?' selected':'')+'>'+esc(v.name)+' · '+esc(v.lang)+genderTag(v)+'</option>';
    }).join('');
  }
  var msg='';
  if(!tts.ok) msg='<div class="note">Este navegador no ofrece voz sintética. Prueba con una versión actual de Edge, Chrome o Safari.</div>';
  else if(!tts.voices.length) msg='<div class="note">Todavía no aparecen voces en inglés. Espera un momento y vuelve a abrir este panel. Si sigue igual, instala una voz en inglés en tu sistema y reinicia el navegador.</div>';
  var nat=tts.voices.filter(function(v){return /natural|neural/i.test(v.name);}).length;
  var isEdge=/Edg\//.test(navigator.userAgent||'');
  var status='';
  if(tts.ok&&tts.voices.length){
    status=nat?'<div class="note">Encontré '+nat+(nat===1?' voz natural':' voces naturales')+' en este navegador.</div>':
      (isEdge?'<div class="note">Estás en Edge, pero no aparecen voces "Natural". Revisa tu conexión a internet (son voces en línea) y reinicia Edge.</div>':
       '<div class="note">No aparecen voces "Natural". Para usar las de Microsoft, abre esta página en Edge.</div>');
  }
  function gopts(role){var g=S.gender[role];return '<option value="F"'+(g==='F'?' selected':'')+'>Mujer</option><option value="M"'+(g==='M'?' selected':'')+'>Hombre</option>';}
  return '<section class="card"><h2>Voces</h2>'+
   '<p class="lead">Elige el sexo de cada personaje y la app usa la mejor voz de ese tipo. También puedes escoger una voz concreta, que tiene prioridad.</p>'+msg+status+
   '<div class="grid2">'+
    '<div class="field"><label for="g-B">Otra persona</label><select id="g-B" data-gender="B">'+gopts('B')+'</select><label for="v-B">Voz de la otra persona</label><select id="v-B" data-voice="B">'+opts('B')+'</select><button class="btn" data-act="voiceTest" data-r="B">'+PLAY+' Probar</button></div>'+
    '<div class="field"><label for="g-C">Tú</label><select id="g-C" data-gender="C">'+gopts('C')+'</select><label for="v-C">Tu voz</label><select id="v-C" data-voice="C">'+opts('C')+'</select><button class="btn" data-act="voiceTest" data-r="C">'+PLAY+' Probar</button></div>'+
   '</div>'+
   '<p class="muted small" style="margin:0">En Edge hay voces "Natural" en línea (Aria, Guy y otras). En Mac, descarga voces Premium o Mejoradas en Ajustes del Sistema > Accesibilidad > Contenido hablado. Después de instalar voces nuevas, reinicia el navegador. El navegador no informa el sexo de cada voz: la app lo deduce por el nombre, y si una voz no se reconoce se usa solo cuando no hay otra del sexo elegido.</p></section>';
}
function refreshVoicePanel(){
  var el=document.getElementById('voicepanel');
  if(el&&S.voicesOpen) el.innerHTML=voicePanel();
}

/* ---------- Render ---------- */
function goStep(i){
  stopAudio(); abortTalk(); S.sp.open=null;
  S.step=Math.max(0,Math.min(STEPS.length-1,i)); S.max=Math.max(S.max,S.step);
  if(S.step===3&&!S.ex) exStart();
  if(S.step===4&&!S.sim) simInit();
  if(S.step===5&&!S.mine) mineInit();
  render(); top();
}

/* ---------- Actions ---------- */
var H={
  openUnit:function(el){stopAudio();abortTalk();setUnit(el.dataset.id);S.view='lesson';save();render();top();},
  copyAI:function(el){var t=aiPrompt();function sel(){var r=document.createRange();r.selectNodeContents(document.getElementById('aiprompt'));var q=getSelection();q.removeAllRanges();q.addRange(r);el.textContent='Selecciona y copia (Ctrl+C)';}try{navigator.clipboard.writeText(t).then(function(){el.textContent='Copiado';},sel);}catch(e){sel();}},
  view:function(el){stopAudio();abortTalk();S.view=el.dataset.v;if(S.view==='review')revStart();render();top();},
  voicesToggle:function(){S.voicesOpen=!S.voicesOpen;if(S.voicesOpen)loadVoices();render();},
  voiceTest:function(el){var r=el.dataset.r;say(r==='B'?'Hi! What can I get for you?':'Hi. Can I get a medium latte, please?',r);},
  go:function(el){var i=+el.dataset.i;if(i<=S.max)goStep(i);},
  next:function(){goStep(S.step+1);},
  back:function(){goStep(S.step-1);},
  tog:function(el){var k=el.dataset.k;S.set[k]=!S.set[k];save();render();},
  reveal:function(el){S.revealed[el.dataset.k]=true;render();},
  say:function(el){stopAudio();say(el.dataset.t,el.dataset.r,!!el.dataset.slow);},
  sayseq:function(el){
    var c=chunkById(el.dataset.id), i=S.sp.sel[c.id];
    if(i!==undefined&&c.slots&&c.slots[i]){stopAudio();say(c.slots[i].t,c.sr);} else sayList(c.say);
  },
  slot:function(el){
    var c=chunkById(el.dataset.id), i=+el.dataset.i;
    S.sp.sel[c.id]=(S.sp.sel[c.id]===i)?undefined:i;
    if(S.talk.key==='chunk:'+c.id) S.talk.res=null;
    render();
    if(S.sp.sel[c.id]!==undefined){stopAudio();say(c.slots[i].t,c.sr);}
  },
  chunkSlow:function(el){var c=chunkById(el.dataset.id),cur=curText(c);stopAudio();say(cur.t,cur.role,true);},
  chunkRepeat:function(el){var c=chunkById(el.dataset.id),cur=curText(c);repeatLine(cur.t,cur.role);},
  chunkSay:function(el){
    var id=el.dataset.id; abortTalk(); stopAudio();
    if(S.sp.open===id){S.sp.open=null;}
    else{S.sp.open=id;S.talk={key:'chunk:'+id,res:null,typed:''};TK.err='';}
    render();
  },
  micStart:function(el){
    var key=el.dataset.key, ctx;
    S.talk.key=key; S.talk.res=null;
    if(key==='mine'){
      if(S.mine) S.mine.res=null;
      ctx={key:key,onDone:function(t){mineAnswer(t);}};
    } else {
      var id=key.slice(6);
      ctx={key:key,onDone:function(t){chunkAnswer(id,t);}};
    }
    startTalk(ctx);
  },
  micStop:function(){stopTalk();},
  typedCheck:function(el){
    var key=el.dataset.key, inp=document.getElementById('typed'), txt=inp?inp.value:'';
    S.talk.typed='';
    if(key==='mine') mineAnswer(txt); else chunkAnswer(key.slice(6),txt);
  },
  mineStart:function(){S.mine.n=0;render();say(TURNS[0].say(S.mine.m),'B');},
  mineRestart:function(){mineInit();S.mine.n=0;render();top();say(TURNS[0].say(S.mine.m),'B');},
  mineHint:function(){S.mine.hint=!S.mine.hint;render();},
  mineNext:function(){
    var m=S.mine, r=m.res; if(!r||r.lvl==='off'||r.lvl==='none') return;
    mineAdvance(r.heard,(r.lvl==='ok'||m.tries>0)?r.msg:'');
  },
  mineSkip:function(){
    var m=S.mine, f=TURNS[m.n].fallback(m.m);
    applySet(m,f.set);
    mineAdvance(f.model,'No salió este turno. Modelo: "'+f.model+'"');
  },
  copyurl:function(){
    var done=function(){S.copied=true;render();};
    try{navigator.clipboard.writeText(ARTIFACT_URL).then(done,selectUrl);}catch(e){selectUrl();}
  },
  hideedge:function(){S.edgeHide=true;render();},
  playall:async function(){
    var btn=document.getElementById('playall');
    if(S.playing){stopAudio();if(btn)btn.textContent='▶ Escuchar la escena completa';return;}
    stopAudio(); var my=RUN; S.playing=true; if(btn)btn.textContent='■ Detener';
    for(var i=0;i<LINES.length;i++){
      if(my!==RUN) return;
      var l=LINES[i], row=document.getElementById('line-'+l.id);
      if(row){row.classList.add('now');try{row.scrollIntoView({block:'nearest'});}catch(e){}}
      await say(l.en,l.r);
      if(row) row.classList.remove('now');
      if(my!==RUN) return;
      await sleep(300);
    }
    S.playing=false; btn=document.getElementById('playall'); if(btn)btn.textContent='▶ Escuchar la escena completa';
  },
  exPick:function(el){
    var ex=S.ex; if(ex.picked!==null) return;
    var it=exItem(), i=+el.dataset.i; ex.picked=i;
    exRecord(it,i===it.ans);
    if(it.say) say(it.say[0],it.say[1]); else if(it.t==='reply') say(it.opts[it.ans],'C');
    render();
  },
  exTok:function(el){var ex=S.ex; if(ex.result!==null) return; ex.built.push(+el.dataset.w); render();},
  exUndo:function(el){var ex=S.ex; if(ex.result!==null) return; var w=+el.dataset.w; ex.built=ex.built.filter(function(x){return x!==w;}); render();},
  exCheck:function(){
    var ex=S.ex, it=exItem(); if(ex.result!==null) return;
    var g=ex.built.map(function(wi){return it.words[wi];});
    var ok=g.length===it.ans.length&&g.every(function(w,i){return w===it.ans[i];});
    exRecord(it,ok); if(it.say) say(it.say[0],it.say[1]); render();
  },
  exNext:function(){
    var ex=S.ex; ex.idx++;
    if(ex.idx>=ex.queue.length){ex.done=true;recProg('ex',EX.filter(function(e){return ex.first[e.id];}).length);} else exPrep();
    render(); top();
  },
  exRestart:function(){exStart();render();top();},
  simStart:function(){S.sim.node=0;S.sim.tried=[];S.sim.fb=null;render();say(SIM[0].b,'B');},
  simPick:function(el){
    var s=S.sim, n=SIM[s.node], i=+el.dataset.i, o=n.opts[i];
    if(s.tried.indexOf(i)>=0||(s.fb&&s.fb.resolved)) return;
    if(s.tried.length===0&&o.k==='best') s.nat++;
    s.tried.push(i);
    if(o.k==='off'){ s.fb={k:'off',f:o.f,resolved:false}; }
    else{
      s.fb={k:o.k,f:o.f,resolved:true};
      s.log.push({r:'B',en:n.b},{r:'C',en:o.t});
      if(s.node===1&&o.place) s.place=o.place;
      say(o.t,'C');
    }
    render();
  },
  simNext:function(){
    var s=S.sim; s.node++; s.tried=[]; s.fb=null;
    if(s.node>=SIM.length){s.done=true;recProg('sim',s.nat);render();top();return;}
    render(); say(SIM[s.node].b,'B');
  },
  simRestart:function(){simInit();render();top();},
  saveDeck:function(){
    CHUNKS.forEach(function(c){ if(!S.deck[c.id]) S.deck[c.id]={box:1,due:Date.now()}; });
    save(); render();
  },
  restart:function(){setUnit(U.id);goStep(0);},
  revShow:function(){S.review.show=true;render();},
  revsay:function(){var c=chunkById(S.review.queue[0]);stopAudio();sayList(c.say);},
  revRate:function(el){
    var r=S.review, id=r.queue.shift(), d=S.deck[id], v=el.dataset.v, now=Date.now();
    if(v==='no'){ d.box=1; d.due=now+10*60000; if(!r.again[id]){r.again[id]=true; r.queue.push(id);} else r.done++; }
    else if(v==='almost'){ d.due=now+BOXDAYS[Math.max(1,d.box)]*864e5; r.done++; }
    else { d.box=Math.min(6,d.box+1); d.due=now+BOXDAYS[d.box]*864e5; r.done++; }
    r.show=false; save(); render();
  }
};
app.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el||!app.contains(el)) return;
  if(el.tagName==='INPUT') return;
  var f=H[el.dataset.act]; if(f) f(el,e);
});
app.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.voice){ S.voices[el.dataset.voice]=el.value; save(); return; }
  if(el.dataset&&el.dataset.gender){ S.gender[el.dataset.gender]=el.value; save(); return; }
  if(el.tagName==='INPUT'&&el.dataset.act&&H[el.dataset.act]){ H[el.dataset.act](el,e); return; }
});
app.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.typed){S.talk.key=el.dataset.key;S.talk.typed=el.value;}
});
app.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ') return;
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.typed){e.preventDefault();H.typedCheck(e.target);return;}
  var el=e.target; if(el.getAttribute&&el.getAttribute('role')==='button'&&el.dataset.act){ e.preventDefault(); H[el.dataset.act](el,e); }
});
setUnit(S.unit);
dictInit();
render();
})();
</script>
</body>
